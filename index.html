<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL変更のお知らせ</title>
    <style>
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans JP", sans-serif;
            background-color: #f4f7f9;
            color: #333333;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            max-width: 550px;
            width: 90%;
            background-color: #ffffff;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
            padding: 40px 30px;
            text-align: center;
            border-top: 6px solid #2b6cb0;
        }
        .icon {
            font-size: 48px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 22px;
            color: #1a365d;
            margin-bottom: 20px;
            font-weight: 700;
        }
        p {
            font-size: 15px;
            line-height: 1.8;
            color: #4a5568;
            margin-bottom: 16px;
        }
        .alert-text {
            color: #e53e3e;
            font-weight: bold;
            background-color: #fff5f5;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #fed7d7;
            margin: 25px 0;
        }
        .btn {
            display: inline-block;
            background-color: #2b6cb0;
            color: #ffffff;
            text-decoration: none;
            padding: 14px 32px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 4px 12px rgba(43, 108, 176, 0.2);
            margin-bottom: 20px;
        }
        .btn:hover {
            background-color: #2c5282;
        }
        .btn:active {
            transform: scale(0.98);
        }
        .footer-text {
            font-size: 13px;
            color: #718096;
            margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="icon">🌐</div>
        <h1>変更のお知らせ</h1>
        
        <p>
            ワードハンティングのURL（アドレス）を変更いたしました。
        </p>

        <p class="alert-text">
            ⚠️ まもなく現在のURLは無効となります。
        </p>

        <p>
            お手数ですが、新しいURLへの移動をお願いいたします。
        </p>

        <a href="https://naga-ryo.github.io/word-hunting/" class="btn">新しいURLへ移動する</a>

    </div>

</body>
</html>
